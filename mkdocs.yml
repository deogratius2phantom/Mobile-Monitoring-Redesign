site_name: Mobile Air Quality Monitor
site_description: User and maker documentation for the Mobile Monitoring Redesign hardware project.
site_url: https://deogratius2phantom.github.io/Mobile-Monitoring-Redesign/
repo_url: https://github.com/deogratius2phantom/Mobile-Monitoring-Redesign
repo_name: deogratius2phantom/Mobile-Monitoring-Redesign

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Hardware Overview: hardware-overview.md
  - Setup and First Use: setup-and-first-use.md
  - Operating the Device: operating-the-device.md
  - Troubleshooting: troubleshooting.md
  - Safety and Care: safety-and-care.md
  - Maker and Contributor Reference: maker-and-contributor-reference.md
